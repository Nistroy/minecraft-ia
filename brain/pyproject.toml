[project]
name = "minecraft-ia"
version = "0.2.0"
description = "Cerveau de l'assistant IA en jeu pour serveur Minecraft moddé"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "google-genai==2.23.0",
    "httpx>=0.28",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.16"]

[project.scripts]
minecraft-ia = "minecraft_ia.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minecraft_ia = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
# E501 : `ruff format` gère la longueur du code ; SQL et prompts restent lisibles d'un bloc.
# S603/S607 : git lancé avec une liste d'arguments, jamais de shell.
ignore = ["E501", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S104", "S105", "S106"]
