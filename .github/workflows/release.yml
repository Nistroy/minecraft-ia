name: release

# Tag vX.Y.Z (= version de mod/gradle.properties) → build + tests → release GitHub avec le jar.
# Le pack packwiz du serveur référence l'URL de ce jar.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: version du tag = version du mod
        run: |
          version="$(grep '^version=' mod/gradle.properties | cut -d= -f2)"
          test "v${version}" = "${GITHUB_REF_NAME}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - run: ./gradlew build
        working-directory: mod
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "mod/build/libs/minecraft-ia-${VERSION}.jar" --title "${GITHUB_REF_NAME}" --generate-notes
